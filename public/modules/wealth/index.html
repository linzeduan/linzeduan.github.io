<main class="app"><header><div class="brand"><div class="mark" aria-hidden="true">↗</div><div><h1>复利人生</h1><p>每个月，看看自己的积累。</p></div></div><div class="tools"><button class="month" id="monthSelect" aria-label="选择月份" aria-haspopup="dialog" aria-expanded="false" aria-controls="monthPicker"><span id="monthLabel"></span><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><button class="btn" id="newMonth">＋ 新的月份</button></div></header>
<section class="hero"><div class="net-panel"><p class="eyebrow" id="periodLabel"></p><h2>净资产</h2><div class="money"><span class="currency">¥</span><span id="net"></span></div><div class="hero-foot" id="change"></div></div>
<div class="allocation glass"><div class="donut" id="allocationChart" role="img" aria-label="资产构成"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="48"/><circle class="cash-arc" id="cashArc" cx="60" cy="60" r="48" pathLength="100"/><circle class="equity-arc" id="equityArc" cx="60" cy="60" r="48" pathLength="100"/></svg><div class="donut-center" aria-hidden="true"><strong id="assetCount"></strong><span>资产账户</span></div></div><div class="legend"><h2>资产构成</h2><div class="legend-row"><i class="dot"></i><span>现金</span><b id="cashPercent"></b></div><div class="legend-row"><i class="dot equity-dot"></i><span>权益</span><b id="equityPercent"></b></div><small>按你的账户分类 · 不含债务</small></div></div>
<div class="summary glass"><div><span>总资产</span><strong id="assets"></strong></div><div><span class="debt-title">债务<small id="debtRatio"></small></span><strong id="debt"></strong><div class="debt-bar" aria-hidden="true"><i id="debtFill"></i></div></div></div></section>
<section id="accountsView"><div class="section-head"><h2>我的账户</h2><span class="muted">点金额修改 · 横条表示分类内占比</span></div><div class="mobile-groups" aria-label="账户分类"><button data-group="cash" class="active" aria-pressed="true">现金</button><button data-group="equity" aria-pressed="false">权益</button><button data-group="debt" aria-pressed="false">债务</button></div><div class="cards" id="cards"></div><div class="footnote"><span id="saveStatus" class="save" role="status">已保存在本机</span><span>人民币元 · 债务填欠款金额</span></div></section>
<section id="historyView" class="hidden"><div class="history-card glass"><h2>积累的轨迹</h2><div id="trend"></div></div><div class="history-card glass"><h2>每月一份记录</h2><table class="history-table"><thead><tr><th>月份</th><th class="hide-mobile">总资产</th><th class="hide-mobile">债务</th><th>净资产</th><th>较上次</th></tr></thead><tbody id="historyRows"></tbody></table><div class="data-actions"><button class="btn" id="backup">导出备份</button><button class="btn" id="restore">恢复备份</button><button class="btn" id="csv">导出本月表格</button><button class="btn danger-text" id="deleteMonth">删除本月记录</button></div><p class="source-note">数据保存在当前浏览器中，不会自动同步到其他设备。每次月度更新后，导出一份备份即可。</p><div class="source-note" id="sourceNote"></div></div></section>
</main><nav class="tabbar" aria-label="主导航"><button class="tab active" id="accountsTab" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 9h18M15 14h3"/></svg>账户</button><button class="tab" id="historyTab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4v16h17M7 15l4-5 4 2 5-7"/></svg>历史</button></nav>
<div id="monthPicker" popover="auto" role="dialog" aria-label="选择记录月份"><div class="calendar-head"><button id="previousYear" class="year-arrow" aria-label="上一年"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m10 3-5 5 5 5"/></svg></button><strong id="calendarYear" aria-live="polite"></strong><button id="nextYear" class="year-arrow" aria-label="下一年"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button></div><div id="monthGrid" class="month-grid" role="group" aria-label="月份"></div><div class="calendar-foot"><span><i></i> 已有记录</span><button id="returnMonth">回到所选月份</button></div></div>
<dialog id="monthDialog"><form id="monthForm"><h2>开始新的一个月</h2><p>沿用最近一期的账户和余额，你只需要逐项更新。以前的月份会完整保留。</p><label>记录月份<input type="month" id="monthInput" required min="2000-01" max="2100-12"></label><div class="error" id="monthError"></div><div class="dialog-actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">建立记录</button></div></form></dialog>
<dialog id="accountDialog"><form id="accountForm"><h2>加一个账户</h2><label>账户名称<input id="accountName" maxlength="40" required placeholder="例如：工资卡"></label><label>所属分类<select id="accountGroup"><option value="cash">现金</option><option value="equity">权益</option><option value="debt">债务</option></select></label><div class="error" id="accountError"></div><div class="dialog-actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">添加</button></div></form></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle" aria-describedby="deleteDescription"><div class="delete-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></svg></div><h2 id="deleteTitle">删除本月记录？</h2><p id="deleteDescription"></p><div class="dialog-actions"><button class="btn" data-close autofocus>保留记录</button><button class="btn danger" id="confirmDelete">确认删除</button></div></dialog>
<dialog id="restoreDialog"><h2>恢复这份备份？</h2><p id="restoreText"></p><p>恢复前会先下载当前数据的备份。随后用所选文件替换本机记录。</p><div class="dialog-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="confirmRestore">备份并恢复</button></div></dialog><input type="file" id="backupFile" accept="application/json,.json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='fuli-monthly-assets-v1', $=id=>document.getElementById(id), groups=[['cash','现金'],['equity','权益'],['debt','债务']];
const seedRows=[];
const initialMonth=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit'}).format(new Date());
const seed={version:1,selected:initialMonth,months:{[initialMonth]:{accounts:[],source:false,updated:null}}};
const clone=x=>JSON.parse(JSON.stringify(x));let state=clone(seed),tab='accounts',restoreData=null,storageOK=true;
function validate(d){if(!d||d.version!==1||!d.months||typeof d.months!=='object'||Array.isArray(d.months))throw Error('备份格式不正确');const keys=Object.keys(d.months);if(!keys.length||keys.length>1212||!keys.includes(d.selected))throw Error('月份记录不正确');for(const m of keys){if(!/^(20\d{2}|2100)-(0[1-9]|1[0-2])$/.test(m))throw Error('月份格式不正确');let a=d.months[m]?.accounts;if(!Array.isArray(a)||a.length>500)throw Error('账户记录不正确');let ids=new Set();for(const x of a){if(!x||typeof x.id!=='string'||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||x.name.length>40||!groups.some(g=>g[0]===x.group)||!Number.isSafeInteger(x.cents)||x.cents<0||x.cents>1e14||typeof x.reviewed!=='boolean')throw Error('账户金额或名称不正确');ids.add(x.id)}}return d;}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){storageOK=false;setTimeout(()=>toast('本机记录无法读取。请先恢复备份；当前显示空白账本。'),100);}
function money(c){return(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sums(m){const a=state.months[m].accounts;const cash=a.filter(x=>x.group==='cash').reduce((s,x)=>s+x.cents,0),equity=a.filter(x=>x.group==='equity').reduce((s,x)=>s+x.cents,0),debt=a.filter(x=>x.group==='debt').reduce((s,x)=>s+x.cents,0);return{cash,equity,debt,assets:cash+equity,net:cash+equity-debt}}
function text(tag,content,cls){let e=document.createElement(tag);e.textContent=content;if(cls)e.className=cls;return e}
let timer;function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function save(){if(!storageOK){$('saveStatus').textContent='未保存，请导出备份';return false}try{localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='已自动保存到本机';return true}catch(e){storageOK=false;$('saveStatus').textContent='无法保存，请导出备份';toast('浏览器无法保存，请到历史页导出备份。');return false}}
function renderSummary(){const m=state.selected,t=sums(m),keys=Object.keys(state.months).sort(),prev=keys.filter(k=>k<m).pop();$('periodLabel').textContent=m.replace('-',' / ')+' · 月度记录';$('net').textContent=money(t.net);$('assets').textContent='¥ '+money(t.assets);$('debt').textContent='¥ '+money(t.debt);const pending=state.months[m].accounts.filter(x=>!x.reviewed).length;let desc=prev?`较 ${prev} ${t.net>=sums(prev).net?'增加':'减少'} ¥ ${money(Math.abs(t.net-sums(prev).net))}`:'从这个月开始，慢慢积累。';$('change').textContent=pending?`还有 ${pending} 个账户待更新 · 余额暂沿用上一期`:desc;for(const [g]of groups){const el=$('total-'+g);if(el)el.textContent='¥ '+money(t[g])}renderVisuals()}
function render(){renderMonthPicker();const box=$('cards');box.replaceChildren();for(const [g,label]of groups){const card=text('article','','card glass '+g),top=text('div','','card-top'),heading=text('div','','category');heading.append(text('span','','dot'),document.createTextNode(label));let plus=text('button','+','plus');plus.setAttribute('aria-label','添加'+label+'账户');plus.onclick=()=>{$('accountGroup').value=g;$('accountName').value='';$('accountError').textContent='';$('accountDialog').showModal()};top.append(heading,plus);card.append(top);let total=text('div','','card-total');total.id='total-'+g;card.append(total);for(const a of state.months[state.selected].accounts.filter(x=>x.group===g)){let row=text('div','','account'),label=text('label',a.name),input=document.createElement('input');input.id='amount-'+a.id;label.htmlFor=input.id;input.type='text';input.inputMode='decimal';input.autocomplete='off';input.value=money(a.cents);input.setAttribute('aria-label',a.name+'余额');input.dataset.id=a.id;if(!a.reviewed)label.append(text('span','待更新','pending'));input.addEventListener('focus',()=>{input.value=(a.cents/100).toFixed(2);input.select()});input.addEventListener('input',()=>{const value=parseAmount(input.value);if(value===null){input.classList.add('invalid');input.setAttribute('aria-invalid','true');$('saveStatus').textContent='请输入有效金额，最多两位小数';return}input.classList.remove('invalid');input.removeAttribute('aria-invalid');a.cents=value;a.reviewed=true;state.months[state.selected].updated=new Date().toISOString();label.querySelector('.pending')?.remove();save();renderSummary()});input.addEventListener('blur',()=>{if(parseAmount(input.value)!==null&&!a.reviewed){a.reviewed=true;state.months[state.selected].updated=new Date().toISOString();label.querySelector('.pending')?.remove();save();renderSummary()}if(parseAmount(input.value)===null)toast('无效金额未保存，已保留上次有效金额。');input.value=money(a.cents);input.classList.remove('invalid');input.removeAttribute('aria-invalid');$('saveStatus').textContent=storageOK?'已保存在本机':'未保存，请导出备份'});input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur()});row.append(label,input);card.append(row)}box.append(card)}renderSummary();renderHistory();$('saveStatus').textContent=storageOK?'已保存在本机':'未保存，请导出备份';$('sourceNote').textContent=state.months[state.selected].source?'这是一份导入的历史记录。':'';decorateAccounts();renderVisuals()}
function parseAmount(raw){const s=raw.trim().replace(/,/g,'');if(!/^\d+(\.\d{0,2})?$/.test(s))return null;let n=Math.round(Number(s)*100);return Number.isSafeInteger(n)&&n<=1e14?n:null}
function renderHistory(){const keys=Object.keys(state.months).sort();$('historyRows').replaceChildren();for(let i=keys.length-1;i>=0;i--){let m=keys[i],t=sums(m),tr=document.createElement('tr'),td=document.createElement('td'),b=text('button',m);b.onclick=()=>{state.selected=m;save();render();switchTab('accounts')};td.append(b);tr.append(td,text('td',money(t.assets),'hide-mobile'),text('td',money(t.debt),'hide-mobile'),text('td',money(t.net)));const pending=state.months[m].accounts.some(x=>!x.reviewed);tr.append(text('td',pending?'待更新':i>0?(t.net-sums(keys[i-1]).net>=0?'+':'−')+money(Math.abs(t.net-sums(keys[i-1]).net)):'—'));$('historyRows').append(tr)}let target=$('trend');target.replaceChildren();const complete=keys.filter(k=>state.months[k].accounts.every(x=>x.reviewed));if(complete.length<2){target.append(text('div','再记录一个月，就能看到净资产的变化。','empty'));return}const vals=complete.map(k=>sums(k).net),min=Math.min(...vals),max=Math.max(...vals),span=max-min||Math.max(100,Math.abs(max)*.1),pad=span*.15,lo=min-pad,hi=max+pad;const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 900 190');svg.classList.add('trend');svg.setAttribute('role','img');svg.setAttribute('aria-label','净资产趋势，仅包含已更新的月份');const pts=vals.map((v,i)=>[75+i*790/(vals.length-1),150-(v-lo)/(hi-lo)*125]);for(let i=0;i<3;i++){let y=25+i*62.5,line=document.createElementNS(NS,'line');Object.entries({x1:75,x2:865,y1:y,y2:y,stroke:'#61776620','stroke-dasharray':'4 5'}).forEach(([k,v])=>line.setAttribute(k,v));svg.append(line);let tx=document.createElementNS(NS,'text');tx.setAttribute('x',0);tx.setAttribute('y',y+4);tx.setAttribute('fill','#7a897d');tx.setAttribute('font-size','11');tx.textContent=((hi-(hi-lo)*i/2)/100/10000).toFixed(1)+'万';svg.append(tx)}let path=document.createElementNS(NS,'path');path.setAttribute('d',pts.map(([x,y],i)=>(i?'L':'M')+x+','+y).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke','#648a70');path.setAttribute('stroke-width','3');path.setAttribute('stroke-linejoin','round');svg.append(path);for(let i of[0,pts.length-1]){let tx=document.createElementNS(NS,'text');tx.setAttribute('x',pts[i][0]);tx.setAttribute('y',184);tx.setAttribute('text-anchor',i?'end':'start');tx.setAttribute('font-size','12');tx.setAttribute('fill','#7a897d');tx.textContent=complete[i];svg.append(tx)}target.append(svg)}
function switchTab(t){tab=t;$('accountsView').classList.toggle('hidden',t!=='accounts');$('historyView').classList.toggle('hidden',t!=='history');for(const n of['accounts','history']){$(n+'Tab').classList.toggle('active',n===t);if(n===t)$(n+'Tab').setAttribute('aria-current','page');else $(n+'Tab').removeAttribute('aria-current')}if(t==='history')renderHistory()}
$('accountsTab').onclick=()=>switchTab('accounts');$('historyTab').onclick=()=>switchTab('history');
let calendarYear=Number(state.selected.slice(0,4));
function renderMonthPicker(){
 $('monthSelect').value=state.selected;
 $('monthLabel').textContent=state.selected.replace('-',' 年 ')+' 月';
 $('monthSelect').setAttribute('aria-label','选择月份，当前 '+$('monthLabel').textContent);
 const years=Object.keys(state.months).map(m=>Number(m.slice(0,4))),first=Math.min(...years),last=Math.max(...years);
 calendarYear=Math.max(first,Math.min(last,calendarYear));
 $('calendarYear').textContent=calendarYear+' 年';$('previousYear').disabled=calendarYear<=first;$('nextYear').disabled=calendarYear>=last;
 $('monthGrid').replaceChildren();
 for(let i=1;i<=12;i++){const key=calendarYear+'-'+String(i).padStart(2,'0'),exists=Boolean(state.months[key]),selected=state.selected===key,b=text('button',i+'月','month-cell');b.type='button';b.dataset.month=key;b.disabled=!exists;b.classList.toggle('recorded',exists);b.classList.toggle('selected',selected);b.setAttribute('aria-label',`${calendarYear}年${i}月，${exists?'已有记录':'暂无记录'}`);if(selected)b.setAttribute('aria-current','date');b.onclick=()=>{state.selected=key;save();render();$('monthPicker').hidePopover();$('monthSelect').focus()};$('monthGrid').append(b)}
}
function positionMonthPicker(){const panel=$('monthPicker');if(!panel.matches(':popover-open'))return;const a=$('monthSelect').getBoundingClientRect(),w=panel.offsetWidth,h=panel.offsetHeight;panel.style.left=Math.max(12,Math.min(a.right-w,innerWidth-w-12))+'px';panel.style.top=Math.max(12,Math.min(a.bottom+10,innerHeight-h-12))+'px'}
$('monthSelect').onclick=()=>{const panel=$('monthPicker');if(panel.matches(':popover-open')){panel.hidePopover();return}calendarYear=Number(state.selected.slice(0,4));renderMonthPicker();panel.showPopover();positionMonthPicker();$('monthGrid').querySelector('.selected')?.focus({preventScroll:true})};
$('monthPicker').addEventListener('toggle',e=>{$('monthSelect').setAttribute('aria-expanded',String(e.newState==='open'))});
$('previousYear').onclick=()=>{calendarYear--;renderMonthPicker();if($('previousYear').disabled)$('nextYear').focus()};
$('nextYear').onclick=()=>{calendarYear++;renderMonthPicker();if($('nextYear').disabled)$('previousYear').focus()};
$('returnMonth').onclick=()=>{calendarYear=Number(state.selected.slice(0,4));renderMonthPicker();$('monthGrid').querySelector('.selected')?.focus()};
$('monthPicker').addEventListener('keydown',e=>{if(e.key==='Escape'){$('monthPicker').hidePopover();$('monthSelect').focus();return}const cell=e.target.closest('.month-cell');if(!cell)return;const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];if(!step)return;e.preventDefault();const buttons=[...$('monthGrid').children];for(let i=buttons.indexOf(cell)+step;i>=0&&i<12;i+=step){if(!buttons[i].disabled){buttons[i].focus();break}}});
window.addEventListener('resize',positionMonthPicker);
$('newMonth').onclick=()=>{let latest=Object.keys(state.months).sort().pop(),[y,m]=latest.split('-').map(Number);$('monthInput').value=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;$('monthError').textContent='';$('monthDialog').showModal()};
$('monthForm').onsubmit=e=>{e.preventDefault();let m=$('monthInput').value;if(!/^(20\d{2}|2100)-(0[1-9]|1[0-2])$/.test(m))return;if(state.months[m]){$('monthError').textContent='这个月份已经有记录，可在右上角直接切换。';return}let source=Object.keys(state.months).sort().filter(k=>k<m).pop();if(!source){$('monthError').textContent='请选择已有记录之后的月份。';return}state.months[m]={accounts:clone(state.months[source].accounts).map(x=>({...x,reviewed:false})),source:false,updated:null};state.selected=m;save();$('monthDialog').close();render();switchTab('accounts');toast('新月份已建立，逐项更新余额即可。')};
$('accountForm').onsubmit=e=>{e.preventDefault();const name=$('accountName').value.trim(),group=$('accountGroup').value;if(!name)return;let a=state.months[state.selected].accounts;if(a.some(x=>x.name===name)){$('accountError').textContent='已有同名账户，请换个名称。';return}a.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,7),name,group,cents:0,reviewed:false});save();$('accountDialog').close();render()};
let deleteTarget=null;
$('deleteMonth').onclick=()=>{
 if(Object.keys(state.months).length<=1){toast('这是唯一的月份记录，请至少保留一份。');return}
 deleteTarget=state.selected;
 const title=deleteTarget.replace('-',' 年 ')+' 月';
 $('deleteTitle').textContent='删除 '+title+' 的记录？';
 $('deleteDescription').textContent='将删除这个月的全部账户余额，其他月份保留。删除后无法直接撤销。';
 $('deleteDialog').showModal();
};
$('confirmDelete').onclick=()=>{
 const month=deleteTarget;
 if(!month||!state.months[month]){$('deleteDialog').close();toast('这份记录已经不存在。');return}
 if(Object.keys(state.months).length<=1){$('deleteDialog').close();toast('请至少保留一份月份记录。');return}
 const before=state,next=clone(state);delete next.months[month];
 if(next.selected===month){const keys=Object.keys(next.months).sort();next.selected=keys.filter(k=>k<month).pop()||keys[0]}
 state=next;
 if(!save()){state=before;render();$('deleteDialog').close();toast('未能保存，记录没有删除。请先导出备份。');return}
 $('deleteDialog').close();render();toast('已删除 '+month.replace('-',' 年 ')+' 月的记录。');
};
$('deleteDialog').addEventListener('close',()=>{deleteTarget=null});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function backup(){download(JSON.stringify(state,null,2),'复利人生-备份-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
$('backup').onclick=backup;$('restore').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('文件过大，请选择本应用导出的备份');restoreData=clone(validate(JSON.parse(await file.text())));$('restoreText').textContent=`这份备份包含 ${Object.keys(restoreData.months).length} 个月的记录。`;$('restoreDialog').showModal()}catch(err){toast('无法恢复：'+err.message)}e.target.value=''};
$('confirmRestore').onclick=()=>{if(!restoreData)return;backup();state=restoreData;restoreData=null;storageOK=true;save();$('restoreDialog').close();render();toast('备份已恢复。')};
const csvCell=x=>'"'+String(x).replace(/"/g,'""')+'"';$('csv').onclick=()=>{let rows=[['月份','分类','账户','余额（人民币元）']];for(const a of state.months[state.selected].accounts)rows.push([state.selected,groups.find(g=>g[0]===a.group)[1],/^[=+@\-\t\r]/.test(a.name)?"'"+a.name:a.name,(a.cents/100)*(a.group==='debt'?-1:1)]);let t=sums(state.selected);rows.push([state.selected,'合计','总资产',t.assets/100],[state.selected,'合计','净资产',t.net/100]);download('\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'月度资产-'+state.selected+'.csv','text/csv;charset=utf-8')};
window.addEventListener('storage',e=>{if(e.key===KEY){try{state=validate(JSON.parse(e.newValue));render();toast('已同步另一个窗口的修改。')}catch{toast('另一个窗口的记录发生变化，请重新打开。')}}});
let mobileGroup='cash';
const categoryPaths={cash:'<path d="M3 9h18L12 3 3 9Zm2 11h14M7 10v7m5-7v7m5-7v7"/>',equity:'<path d="M4 19h16M6 15l5-6 4 3 5-7M16 5h4v4"/>',debt:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-6 5h3"/>'};
function applyGroup(){document.querySelectorAll('.mobile-groups button').forEach(b=>{const active=b.dataset.group===mobileGroup;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('.card').forEach(c=>c.classList.toggle('mobile-active',c.classList.contains(mobileGroup)))}
document.querySelectorAll('.mobile-groups button').forEach(b=>b.onclick=()=>{mobileGroup=b.dataset.group;applyGroup()});
function decorateAccounts(){for(const[g]of groups){const card=document.querySelector('.card.'+g),dot=card.querySelector('.dot');if(dot){dot.className='category-icon';dot.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+categoryPaths[g]+'</svg>'}const heading=text('div','','table-heading');heading.append(text('span','账户 / 占比'),text('span','余额（元）'));card.append(heading);const list=text('div','','account-list');for(const row of [...card.querySelectorAll('.account')]){const label=row.querySelector('label'),meter=text('span','','account-meter');meter.setAttribute('aria-hidden','true');const fill=document.createElement('i');fill.dataset.meter=row.querySelector('input').dataset.id;meter.append(fill);label.append(meter);list.append(row)}card.append(list)}applyGroup()}
function renderVisuals(){const t=sums(state.selected),items=state.months[state.selected].accounts,cash=t.assets?t.cash/t.assets*100:0,equity=t.assets?t.equity/t.assets*100:0;$('cashArc').setAttribute('stroke-dasharray',`${cash} ${100-cash}`);$('equityArc').setAttribute('stroke-dasharray',`${equity} ${100-equity}`);$('equityArc').setAttribute('stroke-dashoffset',String(-cash));$('cashPercent').textContent=t.assets?cash.toFixed(1)+'%':'—';$('equityPercent').textContent=t.assets?equity.toFixed(1)+'%':'—';$('allocationChart').setAttribute('aria-label',t.assets?`资产构成：现金 ${cash.toFixed(1)}%，权益 ${equity.toFixed(1)}%，不含债务`:'暂无资产余额');$('assetCount').textContent=items.filter(a=>a.group!=='debt').length;const debtRatio=t.assets?t.debt/t.assets*100:0;$('debtRatio').textContent=t.assets?'资产的 '+debtRatio.toFixed(1)+'%':'暂无资产';$('debtFill').style.width=Math.min(100,debtRatio)+'%';for(const a of items){const el=document.querySelector(`[data-meter="${CSS.escape(a.id)}"]`);if(el){const pct=t[a.group]?a.cents/t[a.group]*100:0;el.style.width=pct+'%';el.parentElement.title=`占${groups.find(g=>g[0]===a.group)[1]} ${pct.toFixed(1)}%`}}}
render();if(storageOK)save();
</script></body></html>
